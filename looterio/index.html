<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOTERIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lobster+Two:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:arial,helvetica,sans-serif;font-size:13px;background:#fff;color:#000}
a{color:#1a0dab;text-decoration:none}
a:visited{color:#551a8b}
a:hover{text-decoration:underline}

/* ── HOME ── */
#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:60px}
.h-topbar{position:fixed;top:0;right:0;padding:6px 12px;font-size:12px;display:flex;gap:12px}
.h-topbar a{color:#000;font-size:12px}
.h-topbar a:hover{text-decoration:underline}

.logo-xl{margin-bottom:24px;user-select:none;display:block;max-width:90vw}
.logo-sm{user-select:none;display:block;flex-shrink:0;height:48px}
.c1{color:#4285f4}.c2{color:#ea4335}.c3{color:#fbbc04}.c4{color:#4285f4}.c5{color:#34a853}.c6{color:#ea4335}.c7{color:#4285f4}.c8{color:#fbbc04}

.home-tabs{font-size:13px;margin-bottom:10px;display:flex;gap:0}
.home-tabs a{color:#222;margin:0 8px;text-decoration:none;padding-bottom:3px;border-bottom:2px solid transparent}
.home-tabs a.on{border-bottom:2px solid #1a73e8;color:#1a73e8;font-weight:bold}
.home-tabs a:hover{text-decoration:underline;color:#1a73e8}

.sbar-wrap{display:flex;align-items:center;border:1px solid #d3d3d3;width:488px;max-width:calc(100vw - 32px);padding:7px 12px}
.sbar-wrap:focus-within{border-color:#aaa;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sbar-input{border:none;outline:none;width:100%;font-family:arial,sans-serif;font-size:16px;background:transparent}

.btn-row{display:flex;gap:6px;margin-top:10px}
.btn{background:#f8f8f8;border:1px solid #c6c6c6;color:#333;font-family:arial,sans-serif;font-size:13px;padding:6px 16px;cursor:pointer;border-radius:2px}
.btn:hover{background:#f0f0f0;border-color:#aaa;box-shadow:0 1px 2px rgba(0,0,0,.1)}

.h-footer{position:fixed;bottom:0;width:100%;text-align:center;font-size:11px;color:#666;padding:6px;border-top:1px solid #ebebeb;background:#fff}
.h-footer a{color:#1a0dab;font-size:11px}
.h-footer a:visited{color:#551a8b}

/* ── RESULTS ── */
#results{display:none;min-height:100vh}

.r-header{border-bottom:1px solid #ebebeb;padding:8px 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.rsbar-wrap{display:flex;align-items:center;border:1px solid #d3d3d3;padding:5px 12px;width:400px;max-width:calc(100vw - 180px)}
.rsbar-wrap:focus-within{border-color:#aaa}
.rsbar-input{border:none;outline:none;width:100%;font-family:arial,sans-serif;font-size:15px;background:transparent}
.r-search-btn{background:#f8f8f8;border:1px solid #c6c6c6;font-size:12px;padding:5px 12px;cursor:pointer;border-radius:2px;white-space:nowrap}
.r-search-btn:hover{background:#eee}

.r-tabs{padding:6px 16px 0;border-bottom:1px solid #ebebeb;display:flex;gap:0}
.r-tabs a{color:#222;text-decoration:none;margin-right:16px;padding-bottom:5px;display:inline-block;font-size:13px;border-bottom:3px solid transparent}
.r-tabs a.on{color:#1a73e8;border-bottom:3px solid #1a73e8;font-weight:bold}
.r-tabs a:hover{color:#1a73e8;text-decoration:none}

.r-body{display:flex;padding:0 16px;max-width:1060px}
.r-main{flex:1;padding:8px 0;max-width:640px}

.r-count{color:#666;font-size:12px;margin:8px 0 16px}
.r-count b{color:#000}

.result{margin-bottom:22px}
.result-title a{font-size:18px;color:#1a0dab;font-weight:normal;line-height:1.3}
.result-title a:visited{color:#551a8b}
.result-title a:hover{text-decoration:underline}
.result-url{color:#006621;font-size:13px;margin:2px 0 3px}
.result-desc{color:#545454;font-size:13px;line-height:1.55;max-width:580px}
.result-actions{font-size:12px;color:#666;margin-top:2px}
.result-actions a{font-size:12px;color:#1a0dab}
.r-cat{display:inline;font-size:10px;color:#777;background:#f1f3f4;border:1px solid #dadce0;padding:1px 5px;border-radius:2px;margin-left:8px;vertical-align:middle;font-weight:normal}

.no-results{color:#444;padding:24px 0;font-size:14px;line-height:2}

.r-sidebar{width:260px;padding:12px 0 12px 40px;flex-shrink:0;font-size:12px}
.sbox-title{background:#e8ecf0;border:1px solid #bbb;padding:4px 8px;font-weight:bold;font-size:11px;color:#000}
.sbox{border:1px solid #bbb;border-top:none;padding:8px;margin-bottom:14px}
.sbox a{display:block;font-size:12px;color:#1a0dab;margin-bottom:2px}
.sbox-desc{font-size:11px;color:#666;margin-bottom:7px}

.pag{margin:28px 0;display:flex;align-items:center;gap:2px;font-size:22px;font-style:italic}
.pag a{color:#1a0dab;text-decoration:none;padding:3px 7px;font-weight:bold}
.pag a:hover{text-decoration:underline}
.pag .cur{color:#cc0000;padding:3px 7px;font-weight:bold}
.pag .prev-next{font-size:14px;font-style:normal;font-weight:bold;padding:3px 7px}

@media(max-width:680px){
  .r-sidebar{display:none}
  .logo-xl{font-size:52px}
  .sbar-wrap{width:calc(100vw - 32px)}
  .rsbar-wrap{width:calc(100vw - 120px)}
}
</style>
</head>
<body>

<!-- ══ HOME ══ -->
<div id="home">
  <div class="h-topbar">
    <a href="https://looterstudio.xyz/#market" target="_blank">Market</a>
    <a href="https://looterstudio.xyz/#loot" target="_blank">Forum</a>
    <a href="https://looterstudio.xyz" target="_blank">Sign In</a>
  </div>

  <canvas id="logoCanvas" class="logo-xl" aria-label="LOOTERIO"></canvas>

  <form id="homeForm" onsubmit="doSearch(event)">
    <div class="home-tabs" id="homeTabs">
      <a href="#" class="on" data-cat="all">Web</a>
      <a href="#" data-cat="market">Market</a>
      <a href="#" data-cat="forum">Forum</a>
      <a href="#" data-cat="projects">Projects</a>
      <a href="#" data-cat="ideas">Ideas</a>
    </div>
    <div class="sbar-wrap">
      <input id="homeInput" class="sbar-input" type="text" autocomplete="off" spellcheck="false" aria-label="Search LOOTERIO">
    </div>
    <div class="btn-row">
      <button class="btn" type="submit">Loot Search</button>
      <button class="btn" type="button" onclick="feelingLoot()">I'm Feeling Loot-y</button>
    </div>
  </form>
</div>

<div class="h-footer" id="hFooter">
  <a href="https://looterstudio.xyz" target="_blank">©2026 LooterStudio®</a>
  &nbsp;·&nbsp; Indexing <b>4,093+</b> loot entries
  &nbsp;·&nbsp; <a href="https://brier.world" target="_blank">brier.world</a>
  &nbsp;·&nbsp; <a href="https://looterstudio.xyz/#loot" target="_blank">lootchan</a>
  &nbsp;·&nbsp; <a href="#">About LOOTERIO</a>
</div>

<!-- ══ RESULTS ══ -->
<div id="results">
  <div class="r-header">
    <canvas id="logoCanvasSm" class="logo-sm" onclick="goHome()" style="cursor:pointer" aria-label="LOOTERIO"></canvas>
    <form id="resultsForm" onsubmit="doSearch(event)" style="display:flex;align-items:center;gap:8px">
      <div class="rsbar-wrap">
        <input id="resultsInput" class="rsbar-input" type="text" autocomplete="off" spellcheck="false" aria-label="Search">
      </div>
      <button class="r-search-btn" type="submit">Search</button>
    </form>
  </div>

  <div class="r-tabs" id="rTabs">
    <a href="#" class="on" data-cat="all">Web</a>
    <a href="#" data-cat="market">Market</a>
    <a href="#" data-cat="forum">Forum</a>
    <a href="#" data-cat="projects">Projects</a>
    <a href="#" data-cat="ideas">Ideas</a>
  </div>

  <div class="r-body">
    <div class="r-main">
      <div class="r-count" id="rCount"></div>
      <div id="rList"></div>
      <div class="pag" id="rPag"></div>
    </div>
    <div class="r-sidebar" id="rSidebar"></div>
  </div>
</div>

<script>
var WORKER = 'https://looterio-search.looterstudio.workers.dev';
var LUCKY = ["brier","adan","stat buenos aires","delusional mindset","anonymous market","polymarket","vaults","lootchan","luv"];

var qry='', cat='all', pg=1, PER=8;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

var qry='', cat='all', pg=1, PER=8;
var _cache={};

function doSearch(e){
  if(e)e.preventDefault();
  var q=(document.getElementById('homeInput').value||document.getElementById('resultsInput').value||'').trim();
  if(!q)return;
  qry=q; pg=1; cat='all';
  document.querySelectorAll('#rTabs a').forEach(function(a){a.classList.toggle('on',a.dataset.cat==='all');});
  showResults(q);
}

function feelingLoot(){
  var q=LUCKY[Math.floor(Math.random()*LUCKY.length)];
  qry=q; pg=1; cat='all';
  showResults(q);
}

function goHome(){
  document.getElementById('home').style.display='';
  document.getElementById('results').style.display='none';
  document.getElementById('hFooter').style.display='';
  document.getElementById('homeInput').value='';
}

function showResults(q){
  document.getElementById('homeInput').value=q;
  document.getElementById('resultsInput').value=q;
  document.getElementById('home').style.display='none';
  document.getElementById('results').style.display='';
  document.getElementById('hFooter').style.display='none';
  bindTabs();
  render();
}

function bindTabs(){
  document.querySelectorAll('#rTabs a').forEach(function(a){
    a.onclick=function(e){
      e.preventDefault();
      document.querySelectorAll('#rTabs a').forEach(function(x){x.classList.remove('on');});
      a.classList.add('on');
      cat=a.dataset.cat; pg=1; render();
    };
  });
}

function setLoading(on){
  var el=document.getElementById('rCount');
  if(on) el.innerHTML='<span style="color:#666">Searching...</span>';
}

function render(){
  var cacheKey=qry+'|'+cat+'|'+pg;
  if(_cache[cacheKey]){renderData(_cache[cacheKey]);return;}
  setLoading(true);
  var url=WORKER+'/search?q='+encodeURIComponent(qry)+'&cat='+encodeURIComponent(cat)+'&page='+pg;
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(data){_cache[cacheKey]=data;renderData(data);})
    .catch(function(){
      document.getElementById('rCount').innerHTML='<span style="color:#cc0000">Could not reach search index. Check your connection.</span>';
    });
}

function renderData(data){
  var total=data.total, results=data.results, start=(data.page-1)*data.perPage;

  // count
  var cEl=document.getElementById('rCount');
  if(!total){
    cEl.innerHTML='No results for <b>'+esc(data.q)+'</b>.';
  } else {
    cEl.innerHTML='Results <b>'+(start+1)+'</b>&ndash;<b>'+Math.min(start+data.perPage,total)+'</b> of about <b>'+total+'</b> for <b>'+esc(data.q)+'</b>. ('+data.elapsed+' seconds)';
  }

  // results list
  var html='';
  if(!total){
    html='<div class="no-results">Your search &mdash; <b>'+esc(data.q)+'</b> &mdash; did not match any loot entries.<br>Try: <a href="#" onclick="quickSearch(\'brier\')">brier</a> &nbsp; <a href="#" onclick="quickSearch(\'market\')">market</a> &nbsp; <a href="#" onclick="quickSearch(\'lootchan\')">lootchan</a> &nbsp; <a href="#" onclick="quickSearch(\'stat\')">stat</a></div>';
  } else {
    results.forEach(function(item){
      html+='<div class="result">';
      html+='<div class="result-title"><a href="'+(item.href||'#')+'" target="_blank" rel="noopener">'+esc(item.title)+'</a><span class="r-cat">'+esc(item.cat)+'</span></div>';
      html+='<div class="result-url">'+esc(item.url)+'</div>';
      html+='<div class="result-desc">'+esc(item.desc)+'</div>';
      html+='<div class="result-actions"><a href="#">Cached</a> &mdash; <a href="#">Similar pages</a></div>';
      html+='</div>';
    });
  }
  document.getElementById('rList').innerHTML=html;

  // sidebar
  var side='';
  if(total){
    side+='<div class="sbox-title">Loot Network</div><div class="sbox">';
    side+='<a href="https://looterstudio.xyz" target="_blank">looterstudio.xyz</a><div class="sbox-desc">Home of LooterStudio®</div>';
    side+='<a href="https://brier.world" target="_blank">brier.world</a><div class="sbox-desc">Decentralized quant funds</div>';
    side+='<a href="https://looterstudio.xyz/#loot" target="_blank">lootchan</a><div class="sbox-desc">Forum · /loot/</div>';
    side+='<a href="https://looterstudio.xyz/#stat" target="_blank">stat</a><div class="sbox-desc">Human status competition</div>';
    side+='</div>';
    side+='<div class="sbox-title">Quick Market</div><div class="sbox">';
    side+='<a href="https://looterstudio.xyz/#market" target="_blank">Software &mdash; 4,093</a><div class="sbox-desc">Bots, vaults, signals, models</div>';
    side+='<a href="https://looterstudio.xyz/#market" target="_blank">Books &mdash; 768</a><div class="sbox-desc">Manifestos and frameworks</div>';
    side+='<a href="https://looterstudio.xyz/#market" target="_blank">Apparel &mdash; 82</a><div class="sbox-desc">Always early, never wrong</div>';
    side+='</div>';
  }
  document.getElementById('rSidebar').innerHTML=side;

  // pagination — LOOTERIO letters
  var totalPg=Math.ceil(total/PER);
  var letters='LOOTERIO';
  var pag='';
  if(totalPg>1){
    if(pg>1)pag+='<a href="#" class="prev-next" onclick="goPg('+(pg-1)+');return false;">&laquo; Prev</a>';
    for(var i=1;i<=Math.min(totalPg,letters.length);i++){
      if(i===pg)pag+='<span class="cur">'+letters[i-1]+'</span>';
      else pag+='<a href="#" onclick="goPg('+i+');return false;">'+letters[i-1]+'</a>';
    }
    if(pg<totalPg)pag+='<a href="#" class="prev-next" onclick="goPg('+(pg+1)+');return false;">Next &raquo;</a>';
  }
  document.getElementById('rPag').innerHTML=pag;
}

function goPg(n){pg=n;render();window.scrollTo(0,0);}
function quickSearch(q){qry=q;document.getElementById('resultsInput').value=q;pg=1;render();}
/* ── LOOTERIO LOGO CANVAS ── */
var LETTERS = [
  {ch:'L',c:'#3d6fc9'},
  {ch:'O',c:'#cc3333'},
  {ch:'O',c:'#dd8800'},
  {ch:'T',c:'#3d6fc9'},
  {ch:'E',c:'#2a7a2a'},
  {ch:'R',c:'#cc3333'},
  {ch:'I',c:'#3d6fc9'},
  {ch:'O',c:'#dd8800'}
];

function drawLogo(canvas, fontSize) {
  var dpr = window.devicePixelRatio || 1;
  var font = 'bold ' + fontSize + 'px "Lobster Two", Georgia, serif';
  // measure total width first
  var tmp = document.createElement('canvas').getContext('2d');
  tmp.font = font;
  var letters = LETTERS;
  var gap = fontSize * 0.04;
  var totalW = 0;
  var widths = letters.map(function(l){
    var w = tmp.measureText(l.ch).width;
    totalW += w + gap;
    return w;
  });
  totalW -= gap;
  var padX = fontSize * 0.1, padY = fontSize * 0.18;
  var shadowY = fontSize * 0.06, shadowBlur = fontSize * 0.05;
  var cw = totalW + padX * 2 + shadowBlur * 2;
  var ch = fontSize + padY * 2 + shadowY + shadowBlur;
  canvas.width = Math.ceil(cw * dpr);
  canvas.height = Math.ceil(ch * dpr);
  canvas.style.width = Math.ceil(cw) + 'px';
  canvas.style.height = Math.ceil(ch) + 'px';
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, cw, ch);
  ctx.font = font;
  ctx.textBaseline = 'alphabetic';
  var x = padX;
  var y = padY + fontSize * 0.82;
  letters.forEach(function(l, i) {
    var w = widths[i];
    var depth = Math.round(fontSize * 0.055);
    // 1. outer drop shadow
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.38)';
    ctx.shadowBlur = fontSize * 0.07;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = fontSize * 0.08;
    ctx.fillStyle = l.c;
    ctx.fillText(l.ch, x, y);
    ctx.restore();
    // 2. extrusion layers (3D depth) — dark offset copies going down
    ctx.save();
    for (var s = depth; s >= 1; s--) {
      var t = s / depth;
      ctx.fillStyle = 'rgba(' +
        Math.round(parseInt(l.c.slice(1,3),16) * (1 - t * 0.55)) + ',' +
        Math.round(parseInt(l.c.slice(3,5),16) * (1 - t * 0.55)) + ',' +
        Math.round(parseInt(l.c.slice(5,7),16) * (1 - t * 0.55)) + ',1)';
      ctx.fillText(l.ch, x, y + s);
    }
    ctx.restore();
    // 3. top face with gradient (highlight → base → shadow)
    ctx.save();
    var grad = ctx.createLinearGradient(x, y - fontSize * 0.88, x, y + fontSize * 0.08);
    grad.addColorStop(0,   lighten(l.c, 55));
    grad.addColorStop(0.3, lighten(l.c, 20));
    grad.addColorStop(0.65, l.c);
    grad.addColorStop(1,   darken(l.c, 30));
    ctx.fillStyle = grad;
    ctx.fillText(l.ch, x, y);
    ctx.restore();
    x += w + gap;
  });
}

function lighten(hex, pct) {
  var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,r+pct*2); g=Math.min(255,g+pct*2); b=Math.min(255,b+pct*2);
  return 'rgb('+r+','+g+','+b+')';
}
function darken(hex, pct) {
  var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,r-pct*2); g=Math.max(0,g-pct*2); b=Math.max(0,b-pct*2);
  return 'rgb('+r+','+g+','+b+')';
}

function initLogos() {
  var xl = document.getElementById('logoCanvas');
  var sm = document.getElementById('logoCanvasSm');
  if (xl) drawLogo(xl, 96);
  if (sm) drawLogo(sm, 38);
}

// Wait for font to load before drawing
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(initLogos);
} else {
  window.addEventListener('load', initLogos);
}
</script>
</body>
</html>
