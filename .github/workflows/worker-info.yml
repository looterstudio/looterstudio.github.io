# Read-only look at the Cloudflare account the token sees: who, which KV namespaces, which workers.
name: Worker info

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Account, KV namespaces, workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@3 whoami || true
          echo "--- KV namespaces"
          npx --yes wrangler@3 kv namespace list || true
          echo "--- loot-market deployments"
          npx --yes wrangler@3 deployments list --name loot-market || true
