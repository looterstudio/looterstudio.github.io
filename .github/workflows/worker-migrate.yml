# One-off: carry the live numbers from the old worker into the new LOOT namespace
# (lootstudioscorp account). Safe to re-run: it only writes likes and the ideas list.
name: Worker migrate

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Seed KV
        working-directory: worker
        run: |
          for id in 0001 0002 0003; do
            n=$(curl -sS -m 15 https://loot-market.looterstudio.workers.dev/likes/$id | python3 -c "import sys,json; print(json.load(sys.stdin)['likes'])")
            echo "likes:$id = $n"
            npx --yes wrangler@3 kv key put --binding LOOT "likes:$id" "$n"
          done
          npx --yes wrangler@3 kv key put --binding LOOT ideas --path ideas.json
