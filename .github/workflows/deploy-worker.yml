# Deploys the market worker (likes, visitors, pay-to-reveal) to Cloudflare.
# Runs on every push that touches worker/, or by hand from the Actions tab.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts + KV edit).
name: Deploy worker

on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
      - name: Check /visits answers
        run: |
          sleep 5
          curl -sS -X GET https://loot-market.looterstudio.workers.dev/visits
